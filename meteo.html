<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Météo !!!!</title>

  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />

  <!-- Lien vers les icônes Bootstrap -->
  <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />

  <!-- Lien pour utiliser JavaScript pour les actions de l'utilisateur -->
  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>

  <!-- Lien vers chart.umd.min.js pour utiliser les graphiques pour afficher des données -->
  <script src="node_modules/chart.js/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="css/Style-meteo.css" />
</head>

<body>
  <header>
    <div class="logo">La Météo</div>
    <div class="burger" id="burger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <nav class="nav-links shadow" id="navLinks">
      <div class="d-block">
        <button class="btn colorBtn colorBtnAcceuil w-100 mb-4" onclick="window.location.href = 'index.html';">Revenir à
          l'acceuil</button>
        <input id="search" class="searchBar w-100" type="search" placeholder="Rechercher une ville..."
          onkeyup="filtrer()">
      </div>
      <div class="d-block" id="navLinksVilles">

      </div>

      <button class="btn colorBtn" onclick="recupererDonneesMeteo('caen', 0);">Caen</button>
      <button class="btn colorBtn" onclick="recupererDonneesMeteo('paris', 0);">Paris</button> -->
    </nav>

    <div id="monMenuBurger" class="menuBurger bg-danger">

      <a id="closeBtn" href="#" class="close">X</a>
      <ul>
        <li>Rouen</li>

      <span></span>

      <span></span>

  </header>
  <div>
    <div class="d-flex justify-content-center">
      <i class="bi bi-geo-alt fs-1" id="localisation">Localisation</i>
    </div>
    <div class="d-flex justify-content-center">
      <p>Position actuelle</p>
    </div>
    <div class="d-flex justify-content-center">
      <i class="bi bi-geo-alt fs-3"></i>
      <p class="ms-1 mx-1" id="latitudeActuelle">0</p>
      <p class="ms-3 mx-3" id="longitudeActuelle">0</p>
    </div>
    <div class="d-flex justify-content-center">
      <p>Position ville</p>
    </div>
    <div class="d-flex justify-content-center">
      <i class="bi bi-geo-alt fs-3"></i>
      <p class="ms-1 mx-1" id="latitude">0</p>
      <p class="ms-3 mx-3" id="longitude">0</p>
    </div>
    <div class="d-flex justify-content-center">
      <p id="date">Date</p>
    </div>
  </div>

  <main>
    <div class="d-flex justify-content-center align-items-center">
      <p class="taille-texte-temperature m-3" id="temperature">Température</p>
      <div class="d-block m-3" id="icon-meteo">
        <img src="img/Soleil.ico" alt="Soleil.ico" />
        <p class="text-center" id="meteo">Ciel dégagé</p>
      </div>
    </div>
    <div class="d-flex justify-content-center mb-5">
      <div class="d-flex flex-row justify-content-center infos-meteo rounded-5 shadow">
        <div class="text-center m-3">
          <img src="img/pression-air.ico" alt="pression-air.ico" />
          <p id="infos-meteo-pression-atmosphérique">30%</p>
          <p class="taille-texte-infos-meteo">Pression atmosphérique</p>
        </div>
        <div class="text-center m-3">
          <i class="bi bi-droplet taille-icon-infos-meteo"></i>
          <p id="infos-meteo-humidite">30%</p>
          <p class="taille-texte-infos-meteo">Humidité</p>
        </div>
        <div class="text-center m-3">
          <i class="bi bi-wind taille-icon-infos-meteo"></i>
          <p id="infos-meteo-vit-wind">30%</p>
          <p class="taille-texte-infos-meteo">Vitesse du vent</p>
        </div>
      </div>
    </div>
    <div class="chart-container mb-3">
      <div id="canvas">
      </div>
      <p class="text-center m-3 taille-texte">
        Vous pouvez visualiser la météo des jours suivants plus en détails en
        cliquant sur les boutons si-dessous
      </p>

      <div class="wrapper m-3" id="btns-jour"></div>
  </main>

  <script src="js/script.js"></script>
</body>

</html>
